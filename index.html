<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Stretch Cycle Timer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app — big ring on top, settings below, sticky controls at the bottom */
:root {
  --bg: #eef2ea;
  --surface: #ffffff;
  --ink: #1d2a1f;
  --muted: #5d6b5f;
  --line: #d3dccf;
  --hold: #2f6b45;
  --hold-soft: #dbe8dc;
  --move: #e0a21b;
  --move-soft: #f8ebc8;
  --on-accent: #ffffff;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a14; --surface: #1b251d; --ink: #e8efe6; --muted: #9aa99c; --line: #2c3a2f;
    --hold: #6fbf88; --hold-soft: #22382a; --move: #f2b93b; --move-soft: #3a3019; --on-accent: #10180f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a14; --surface: #1b251d; --ink: #e8efe6; --muted: #9aa99c; --line: #2c3a2f;
  --hold: #6fbf88; --hold-soft: #22382a; --move: #f2b93b; --move-soft: #3a3019; --on-accent: #10180f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  transition: background .4s ease;
}
body.moving { --phase: var(--move); --phase-soft: var(--move-soft); }
body { --phase: var(--hold); --phase-soft: var(--hold-soft); }
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sound { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: 600 .8rem var(--body); cursor: pointer; }
.sound[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }

/* Ring */
.stage { position: relative; width: min(100%, 340px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.stage svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.track { fill: none; stroke: var(--phase-soft); stroke-width: 14; transition: stroke .4s; }
.prog { fill: none; stroke: var(--phase); stroke-width: 14; stroke-linecap: round; transition: stroke .4s; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
.phase { font: 700 .8rem var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--phase); transition: color .4s; }
.count { font-family: var(--display); font-weight: 800; font-size: clamp(5rem, 28vw, 7.5rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.sub { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.next { color: var(--muted); font-size: .85rem; text-align: center; min-height: 1.3em; margin-top: -8px; }

/* Settings */
.settings { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 18px; }
.setting { display: grid; gap: 10px; }
.setting-head { display: flex; justify-content: space-between; align-items: baseline; }
.setting-head label { font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; align-items: center; }
.stepper button { height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 700 1.5rem var(--display); cursor: pointer; }
.stepper button:active { transform: scale(.96); }
.stepper .val { display: flex; align-items: baseline; justify-content: center; gap: 4px; }
.stepper input { width: 3.2ch; border: none; background: transparent; color: var(--ink); text-align: center; font: 800 2.2rem var(--display); font-variant-numeric: tabular-nums; padding: 0; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.unit { color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { flex: 1 1 0; min-width: 56px; padding: 9px 0; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 .9rem var(--body); cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.settings.locked { opacity: .55; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; line-height: 1.45; }

/* Controls */
.controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.controls-inner { max-width: 460px; margin: 0 auto; display: flex; gap: 10px; }
.btn { flex: 1; height: 60px; border-radius: 18px; border: none; font: 700 1.15rem var(--display); cursor: pointer; letter-spacing: .01em; }
.btn-go { background: var(--phase); color: var(--on-accent); transition: background .4s; }
.btn-stop { background: var(--surface); color: var(--ink); border: 1px solid var(--line); flex: 0 0 34%; }
.btn:active { transform: scale(.98); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--phase); outline-offset: 2px; }

/* Landscape: ring on the left, settings + buttons on the right */
@media (orientation: landscape) and (min-width: 560px) {
  body { padding-block: 12px; }
  .wrap {
    max-width: 1000px; display: grid; align-items: start;
    grid-template-columns: minmax(0, 1fr) minmax(0, 380px);
    grid-template-areas: "head head" "stage settings" "next controls";
    column-gap: 32px; row-gap: 10px;
  }
  header { grid-area: head; }
  .stage { grid-area: stage; align-self: center; width: min(100%, calc(100dvh - 110px), 520px); }
  .next { grid-area: next; margin-top: 0; align-self: center; }
  .settings { grid-area: settings; padding: 12px 14px; gap: 12px; }
  .setting { gap: 8px; }
  .controls { grid-area: controls; position: static; padding: 0; background: none; }
  .controls-inner { max-width: none; }
  .btn { height: 52px; }
  .stepper { grid-template-columns: 44px 1fr 44px; }
  .stepper button { height: 44px; }
  .stepper input { font-size: 1.8rem; }
  .chip { padding: 7px 0; }
  .count { font-size: clamp(3.5rem, 20dvh, 8rem); }
}
@media (orientation: landscape) and (min-width: 560px) and (max-height: 520px) {
  .hint { display: none; }
  h1 { font-size: 1.2rem; }
}

.flash { animation: flash .5s ease; }
@keyframes flash { from { transform: scale(1.06); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } body, .track, .prog { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Stretch Cycle</h1>
    <button class="sound" id="sound" aria-pressed="true">Sound on</button>
  </header>

  <div class="stage" id="stage">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="88"></circle>
      <circle class="prog" id="prog" cx="100" cy="100" r="88"></circle>
    </svg>
    <div class="center" aria-live="polite">
      <div class="phase" id="phase">Ready</div>
      <div class="count" id="count">45</div>
      <div class="sub" id="sub">Position 1</div>
    </div>
  </div>
  <div class="next" id="next">Tap Start when everyone's on the mat</div>

  <section class="settings" id="settings">
    <div class="setting">
      <div class="setting-head"><label for="hold">Hold each position</label></div>
      <div class="stepper">
        <button type="button" data-step="hold" data-d="-5" aria-label="5 seconds less">−</button>
        <div class="val"><input id="hold" type="number" inputmode="numeric" min="5" max="600" value="45"><span class="unit">sec</span></div>
        <button type="button" data-step="hold" data-d="5" aria-label="5 seconds more">+</button>
      </div>
      <div class="chips" data-for="hold">
        <button class="chip" type="button" data-v="30">30</button>
        <button class="chip" type="button" data-v="45">45</button>
        <button class="chip" type="button" data-v="60">60</button>
        <button class="chip" type="button" data-v="90">90</button>
      </div>
    </div>
    <div class="setting">
      <div class="setting-head"><label for="move">Switch time</label></div>
      <div class="stepper">
        <button type="button" data-step="move" data-d="-1" aria-label="1 second less">−</button>
        <div class="val"><input id="move" type="number" inputmode="numeric" min="1" max="30" value="3"><span class="unit">sec</span></div>
        <button type="button" data-step="move" data-d="1" aria-label="1 second more">+</button>
      </div>
      <div class="chips" data-for="move">
        <button class="chip" type="button" data-v="3">3</button>
        <button class="chip" type="button" data-v="5">5</button>
        <button class="chip" type="button" data-v="10">10</button>
      </div>
    </div>
    <p class="hint">Changes apply at the next position, even mid-session. Short beeps count down the last 3 seconds; a higher tone means hold.</p>
  </section>

  <div class="controls">
    <div class="controls-inner">
      <button class="btn btn-stop" id="stop" type="button">Stop</button>
      <button class="btn btn-go" id="go" type="button">Start</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const holdIn = $("hold"), moveIn = $("move");
  const prog = $("prog"), countEl = $("count"), phaseEl = $("phase"), subEl = $("sub"), nextEl = $("next");
  const goBtn = $("go"), stopBtn = $("stop"), soundBtn = $("sound");
  const C = 2 * Math.PI * 88;
  prog.style.strokeDasharray = C;

  // Saved settings
  try {
    const s = JSON.parse(localStorage.getItem("stretchCycle") || "{}");
    if (s.hold) holdIn.value = s.hold;
    if (s.move) moveIn.value = s.move;
    if (s.sound === false) setSound(false);
  } catch (e) {}
  function save() {
    try { localStorage.setItem("stretchCycle", JSON.stringify({ hold: +holdIn.value, move: +moveIn.value, sound: soundOn })); } catch (e) {}
  }

  const clamp = (inp) => {
    let v = Math.round(+inp.value || 0);
    v = Math.max(+inp.min, Math.min(+inp.max, v));
    inp.value = v; return v;
  };
  const holdSec = () => clamp(holdIn);
  const moveSec = () => clamp(moveIn);

  function syncChips() {
    document.querySelectorAll(".chips").forEach(g => {
      const v = $(g.dataset.for).value;
      g.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === String(v)));
    });
    if (state === "idle") render(holdSec(), holdSec(), "hold");
  }

  document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
    const inp = $(b.dataset.step);
    inp.value = (+inp.value || 0) + +b.dataset.d;
    clamp(inp); save(); syncChips();
  }));
  document.querySelectorAll(".chips .chip").forEach(c => c.addEventListener("click", () => {
    $(c.parentElement.dataset.for).value = c.dataset.v; save(); syncChips();
  }));
  [holdIn, moveIn].forEach(i => i.addEventListener("change", () => { clamp(i); save(); syncChips(); }));

  // Sound
  let soundOn = true, actx = null;
  function setSound(on) { soundOn = on; soundBtn.setAttribute("aria-pressed", on); soundBtn.textContent = on ? "Sound on" : "Sound off"; }
  soundBtn.addEventListener("click", () => { setSound(!soundOn); save(); unlockAudio(); if (soundOn) beep(880, 0.35); });
  let out = null;
  function unlockAudio() {
    // iOS 17+: play through the speaker even when the silent switch is on
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        // Limiter so tones can run near full scale without crackling
        out = actx.createDynamicsCompressor();
        out.threshold.value = -8; out.knee.value = 4; out.ratio.value = 20;
        out.attack.value = 0.001; out.release.value = 0.08;
        out.connect(actx.destination);
      }
      if (actx.state === "suspended") actx.resume();
    } catch (e) {}
  }
  // Original soft sine tones, played near full volume. A quiet overtone one octave up
  // helps small phone speakers carry the note without making it sound higher.
  function beep(freq, dur = 0.15, delay = 0) {
    if (!soundOn || !actx || !out) return;
    try {
      const t = actx.currentTime + delay, g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.9, t + 0.005);
      g.gain.setValueAtTime(0.9, t + dur - 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(out);
      [[1, 1], [2, 0.35], [3, 0.12]].forEach(([mult, level]) => {
        const o = actx.createOscillator(), og = actx.createGain();
        o.type = "sine"; o.frequency.value = freq * mult; og.gain.value = level;
        o.connect(og).connect(g); o.start(t); o.stop(t + dur + 0.02);
      });
    } catch (e) {}
  }
  const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // Wake lock
  let wake = null;
  async function keepAwake() { try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
  function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state === "running") keepAwake(); });

  // Timer state
  let state = "idle";          // idle | running | paused
  let phase = "hold";          // hold | move
  let phaseLen = 45, endAt = 0, remainingMs = 0, position = 1, startedAt = 0, elapsedBefore = 0;
  let lastWhole = null, timer = null;

  function render(secLeft, len, ph) {
    const frac = Math.max(0, Math.min(1, secLeft / len));
    prog.style.strokeDashoffset = C * (1 - frac);
    countEl.textContent = Math.ceil(secLeft);
  }
  function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function beginPhase(ph) {
    phase = ph;
    phaseLen = ph === "hold" ? holdSec() : moveSec();
    endAt = performance.now() + phaseLen * 1000;
    lastWhole = null;
    document.body.classList.toggle("moving", ph === "move");
    phaseEl.textContent = ph === "hold" ? "Hold" : "Switch";
    nextEl.textContent = ph === "hold" ? `Then ${moveSec()} sec to switch` : `Next: position ${position} · ${holdSec()} sec`;
    countEl.classList.remove("flash"); void countEl.offsetWidth; countEl.classList.add("flash");
    if (ph === "hold") { beep(880, 0.4); vibrate(300); }
    else { beep(520, 0.3); vibrate([120, 80, 120]); }
  }

  function tick() {
    if (state !== "running") return;
    const now = performance.now();
    let left = (endAt - now) / 1000;
    if (left <= 0) {
      if (phase === "hold") { position++; beginPhase("move"); }
      else beginPhase("hold");
      left = phaseLen;
    }
    const whole = Math.ceil(left);
    if (whole !== lastWhole) {
      if (lastWhole !== null && whole <= 3 && whole >= 1 && phase === "hold") beep(660, 0.12);
      lastWhole = whole;
    }
    render(left, phaseLen, phase);
    subEl.textContent = `Position ${position} · ${fmt(elapsedBefore + now - startedAt)}`;
  }

  function loop() { tick(); if (state === "running") requestAnimationFrame(loop); }

  function start() {
    unlockAudio();
    if (state === "idle") {
      position = 1; elapsedBefore = 0; startedAt = performance.now();
      state = "running"; beginPhase("hold");
    } else if (state === "paused") {
      startedAt = performance.now();
      endAt = performance.now() + remainingMs;
      state = "running";
    }
    goBtn.textContent = "Pause";
    keepAwake();
    clearInterval(timer); timer = setInterval(tick, 200); // keeps cycling if frames are throttled
    requestAnimationFrame(loop);
  }
  function pause() {
    state = "paused";
    remainingMs = Math.max(0, endAt - performance.now());
    elapsedBefore += performance.now() - startedAt;
    clearInterval(timer);
    goBtn.textContent = "Resume";
    phaseEl.textContent = "Paused";
    releaseWake();
  }
  function stop() {
    state = "idle"; clearInterval(timer); releaseWake();
    document.body.classList.remove("moving");
    goBtn.textContent = "Start";
    phaseEl.textContent = "Ready";
    const done = position > 1 || elapsedBefore > 0;
    subEl.textContent = "Position 1";
    nextEl.textContent = done ? "Nice work. Tap Start for another round." : "Tap Start when everyone's on the mat";
    render(holdSec(), holdSec(), "hold");
  }

  goBtn.addEventListener("click", () => state === "running" ? pause() : start());
  stopBtn.addEventListener("click", stop);
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && e.target.tagName !== "INPUT") { e.preventDefault(); goBtn.click(); }
  });

  syncChips();
})();
</script>
</body>
</html>
